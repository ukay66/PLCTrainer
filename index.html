<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ESP32 PLC Ladder Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand"><b>PLC</b> Ladder Editor <span class="sub">ESP32 trainer</span></div>
  <label class="pname"><span class="sr">Program name</span><input id="pname" value="Untitled" maxlength="40" spellcheck="false"></label>
  <div class="grp">
    <button id="bNew" title="New program">New</button>
    <button id="bOpen" title="Open a saved program (.json)">Open</button>
    <button id="bSave" title="Save to a file (Ctrl+S)">Save</button>
    <select id="exSel" title="Load an example" aria-label="Examples"><option value="">Examples…</option></select>
  </div>
  <div class="grp">
    <button id="bUndo" title="Undo (Ctrl+Z)">Undo</button>
    <button id="bRedo" title="Redo (Ctrl+Y)">Redo</button>
  </div>
  <div class="grow"></div>
  <div class="grp">
    <button id="bSim" class="tog" title="Run the program here in the browser">Simulate</button>
    <button id="bConn" title="Connect to the ESP32 by USB cable">Connect</button>
    <button id="bSend" class="primary" title="Send the program to the ESP32" disabled>Transfer</button>
    <button id="bRun" disabled>Run</button>
    <button id="bStop" disabled>Stop</button>
    <button id="bMon" class="tog" title="Show live power flow from the ESP32" disabled>Monitor</button>
  </div>
  <input id="fileIn" type="file" accept=".json,application/json" hidden>
</header>

<div class="iobar" aria-label="Inputs and outputs">
  <div class="ioset" id="ioIn"></div>
  <div class="ioset" id="ioOut"></div>
  <div class="ioset grow" id="ioVals"></div>
  <div class="chips">
    <span class="chip" id="chipMode">Edit</span>
    <span class="chip" id="chipLink">Not connected</span>
  </div>
</div>

<main class="layout">
  <aside class="side">
    <section class="card" id="palette">
      <h2>Contacts</h2>
      <div class="pal" id="palC"></div>
      <h2>Outputs</h2>
      <div class="pal" id="palO"></div>
      <h2>Timers and counters</h2>
      <div class="pal" id="palT"></div>
      <h2>Wiring</h2>
      <div class="pal" id="palW"></div>
    </section>
    <section class="card" id="inspector"></section>
  </aside>

  <section class="ladder" id="ladder" aria-label="Ladder program"></section>
</main>

<footer class="foot">
  <details id="probBox" open>
    <summary>Checks <span class="badge" id="probCount">0</span></summary>
    <ul id="probList"></ul>
  </details>
  <details id="logBox">
    <summary>Serial log</summary>
    <pre id="log"></pre>
  </details>
</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script src="engine.js"></script>
<script src="examples.js"></script>
<script src="app.js"></script>
</body>
</html>
